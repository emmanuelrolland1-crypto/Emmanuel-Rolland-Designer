<html lang="fr">
<head>

<meta name="author" content="Emmanuel Rolland">
<meta property="og:title" content="Aroma Zone — étude de cas">
<meta property="og:description" content="Application mobile Aroma Zone : un parcours d’achat beauté repensé.">
<meta property="og:type" content="website">

</head>
<body>
<div id="app"></div>
<noscript><p style="color:#EDEBE6;font-family:sans-serif;padding:40px">Ce site nécessite JavaScript.</p></noscript>
<template id="dc-template">
<div id="page-top" style="font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #EDEBE6; background: #0C0C0E; min-height: 100%; overflow: hidden">

  <header style="position: sticky; top: 0; z-index: 20; background: rgba(12,12,14,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(237,235,230,.07)">
    <nav aria-label="Navigation principale" style="max-width: 1280px; margin: 0 auto; padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
      <a href="index.html#projets" class="nav-a" style="display: inline-flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8H3M7 4L3 8l4 4"></path></svg>
        Tous les projets
      </a>
      <a href="index.html#page-top" aria-label="Emmanuel Rolland — accueil" style="display: flex; align-items: center; min-height: 44px"><img src="assets/images/logo-er.webp" alt="" style="display: block; height: 30px; width: auto"></a>
      <a class="btn-light" href="index.html#contact" style="background: #EDEBE6; color: #0C0C0E; padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px">Me contacter</a>
    </nav>
  </header>

  <!-- HEADER + FAN -->
  <section style="max-width: 1280px; margin: 0 auto; padding: 88px 40px 64px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
    <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
      <span class="rise" style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Étude de cas — Aroma Zone</span>
      <h1 class="rise d1" style="margin: 0; font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; font-size: clamp(52px, 6vw, 96px); line-height: 0.98; letter-spacing: -0.02em; text-wrap: balance">Le soin, <em style="color: #B3B0FF">au creux de la main.</em></h1>
      <dl class="rise d2" style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 24px; border-top: 1px solid rgba(237,235,230,.12); padding-top: 28px">
        <div style="display: flex; flex-direction: column; gap: 6px"><dt style="font-size: 13px; color: #8E8C96">Rôle</dt><dd style="margin: 0; font-size: 16px">Lead Product Designer</dd></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><dt style="font-size: 13px; color: #8E8C96">Périmètre</dt><dd style="margin: 0; font-size: 16px">Application mobile</dd></div>      </dl>
    </div>
    <div class="fan" style="flex: 1 1 440px; min-width: 0; position: relative; height: 560px">
      <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(245,170,120,.18), rgba(245,170,120,0) 68%)"></div>
      <div style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: center">
        <img class="fanph f1" src="assets/images/az-produit.webp" alt="" style="width: 200px; margin-right: -70px; transform: translateY(24px) rotate(-4deg); filter: drop-shadow(0 30px 50px rgba(0,0,0,.55))">
        <img class="fanph" src="assets/images/az-accueil.webp" alt="App Aroma Zone — accueil personnalisé" style="position: relative; z-index: 2; width: 236px; filter: drop-shadow(0 40px 60px rgba(0,0,0,.6))">
        <img class="fanph f3" src="assets/images/az-favoris.webp" alt="" style="width: 200px; margin-left: -70px; transform: translateY(24px) rotate(4deg); filter: drop-shadow(0 30px 50px rgba(0,0,0,.55))">
      </div>
    </div>
  </section>

  <section style="max-width: 1280px; margin: 0 auto; padding: 24px 40px 96px; display: flex; flex-wrap: wrap; gap: 32px 64px">
    <h2 style="flex: 1 1 240px; margin: 0; font-size: 14px; font-weight: 500; color: #B3B0FF">Problématique</h2>
    <p style="flex: 3 1 560px; min-width: 0; margin: 0; font-family: 'Instrument Serif', serif; font-size: clamp(28px, 2.6vw, 38px); line-height: 1.22; color: #E2E0E6; text-wrap: pretty">Offrir sur mobile une expérience d’achat à la hauteur de l’expertise Aroma Zone : guider la découverte d’un catalogue très riche, orienter chaque profil vers les bons soins et fluidifier le parcours jusqu’au panier.</p>
  </section>

  <!-- SCREEN EXPLORER (interactive) -->
  <section id="ecrans" aria-label="Explorer les écrans" style="background: radial-gradient(ellipse at 65% 40%, #3A2A20, #111114 62%); border-top: 1px solid rgba(237,235,230,.07); border-bottom: 1px solid rgba(237,235,230,.07)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 40px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
      <div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Explorer les écrans</span>
          <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 52px; line-height: 1">Le parcours d’achat</h2>
        </div>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
          <sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
            <li>
              <button type="button" class="row" onClick="{{s.pick}}" aria-current="{{s.current}}" style="width: 100%; text-align: left; display: flex; gap: 18px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: #EDEBE6; font: inherit; cursor: pointer">
                <span style="font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; color: {{s.numColor}}; min-width: 28px; padding-top: 2px">{{s.num}}</span>
                <span style="display: flex; flex-direction: column; gap: 4px">
                  <span style="font-size: 16px; font-weight: 500">{{s.title}}</span>
                  <span style="font-size: 14px; line-height: 1.5; color: #A3A1AA">{{s.desc}}</span>
                </span>
              </button>
            </li>
          </sc-for>
        </ol>
      </div>
      <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 24px">
        <div style="position: relative; width: 300px; max-width: 100%; aspect-ratio: 678 / 1396; filter: drop-shadow(0 50px 70px rgba(0,0,0,.6))">
          <sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
            <img class="scr" src="{{s.src}}" alt="{{s.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: {{s.op}}; transform: {{s.tf}}">
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 16px">
          <button type="button" class="icon-btn" onClick="{{prev}}" aria-label="Écran précédent" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(237,235,230,.2); background: transparent; color: #EDEBE6; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8H3M7 4L3 8l4 4"></path></svg></button>
          <span style="font-size: 14px; color: #A3A1AA; min-width: 64px; text-align: center">{{counter}}</span>
          <button type="button" class="icon-btn" onClick="{{next}}" aria-label="Écran suivant" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(237,235,230,.2); background: transparent; color: #EDEBE6; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></button>
        </div>
      </div>
    </div>
  </section>

  <!-- NAVIGATION -->
  <section style="max-width: 1280px; margin: 0 auto; padding: 112px 40px 40px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-end">
      <h2 style="flex: 1 1 360px; margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 48px; line-height: 1.02">Naviguer par préoccupation et par univers</h2>
      <p style="flex: 1 1 360px; margin: 0; font-size: 16px; line-height: 1.7; color: #B5B3BC">Un menu à plat, une recherche mise en avant et des entrées par univers — soins visage, cheveux, corps, nutrition — pour trouver son produit en quelques gestes.</p>
    </div>
    <img src="assets/images/az-menu.webp" alt="Trois écrans de navigation de l’app Aroma Zone : menu, soins visage, soins cheveux" style="display: block; width: 100%; border-radius: 24px; aspect-ratio: 1700 / 1160; object-fit: cover">
  </section>

  <section style="max-width: 1280px; margin: 0 auto; padding: 72px 40px 112px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 14px"><span style="font-size: 13px; color: #B3B0FF">01 — Comprendre</span><h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 36px">Recherche</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #B5B3BC">Analyse des usages mobiles et des parcours existants pour comprendre comment les clientes choisissent leurs soins, comparent les produits et utilisent les recettes — et identifier les irritants à lever en priorité.</p></div>
    <div style="display: flex; flex-direction: column; gap: 14px"><span style="font-size: 13px; color: #B3B0FF">02 — Concevoir</span><h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 36px">Parcours &amp; UI</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #B5B3BC">Navigation par préoccupation et par univers, accueil personnalisé, fiche produit centrée sur la décision, favoris et carnets de recettes réunis, panier simplifié — dans une direction visuelle chaleureuse et éditoriale, fidèle à la marque.</p></div>
    <div style="display: flex; flex-direction: column; gap: 14px"><span style="font-size: 13px; color: #B3B0FF">03 — Mesurer</span><h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 36px">Impact visé</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #B5B3BC">Un parcours d’achat plus court et plus lisible, conçu pour être mesuré : conversion, ajout au panier et usage des favoris comme indicateurs de suivi, au service de la fidélisation.</p></div>
  </section>

  <a class="next" href="intelligence-artificielle.html#page-top" style="display: block; border-top: 1px solid rgba(237,235,230,.07)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 72px 40px 88px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 13px; color: #8E8C96">Projet suivant</span>
        <span style="font-family: 'Instrument Serif', serif; font-size: clamp(44px, 6vw, 88px); line-height: 1">Intelligence Artificielle</span>
      </div>
      <svg class="next-arrow" aria-hidden="true" width="56" height="56" viewBox="0 0 16 16" fill="none" stroke="#B3B0FF" stroke-width="0.8"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
    </div>
  </a>
</div>
</template>
<script type="text/x-dc" data-props='{}'>
class Component extends DCLogic {
  componentDidMount() {
    const run = () => { try { const el = document.getElementById('page-top'); let n = el; while (n) { if (n.scrollTop) n.scrollTop = 0; n = n.parentElement; } window.scrollTo(0, 0); if (document.scrollingElement) document.scrollingElement.scrollTop = 0; } catch (e) {} };
    run(); setTimeout(run, 30); setTimeout(run, 250);
  }
  state = { i: 0 };
  renderVals() {
    const S = [
      { src: 'assets/images/az-accueil.webp', title: 'Accueil personnalisé', desc: 'Un accueil éditorial et nominatif, la recherche à portée de pouce et des routines adaptées au profil.' },
      { src: 'assets/images/az-produit.webp', title: 'Fiche produit', desc: 'Visuel immersif, bénéfices clés, avis et prix au litre : tout pour décider, l’ajout au panier sous le pouce.' },
      { src: 'assets/images/az-favoris.webp', title: 'Favoris', desc: 'Articles favoris et carnets de recettes réunis au même endroit.' },
      { src: 'assets/images/az-panier.webp', title: 'Panier', desc: 'Quantités modifiables en ligne, éco-participation visible et un appel à l’action unique.' }
    ];
    const i = this.state.i;
    const n = S.length;
    const screens = S.map((s, k) => {
      const on = k === i;
      return {
        ...s,
        alt: 'App Aroma Zone — ' + s.title,
        num: String(k + 1).padStart(2, '0'),
        op: on ? 1 : 0,
        tf: on ? 'translateY(0) scale(1)' : 'translateY(14px) scale(.98)',
        bg: on ? 'rgba(237,235,230,.07)' : 'transparent',
        border: on ? 'rgba(179,176,255,.35)' : 'transparent',
        numColor: on ? '#B3B0FF' : '#6E6C76',
        current: on ? 'true' : 'false',
        pick: () => this.setState({ i: k })
      };
    });
    return {
      screens,
      counter: String(i + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'),
      prev: () => this.setState({ i: (i - 1 + n) % n }),
      next: () => this.setState({ i: (i + 1) % n })
    };
  }
}
</script>
<script src="assets/js/dc-runtime.js"></script>
</body>
</html>
