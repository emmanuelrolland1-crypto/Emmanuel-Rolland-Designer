<script type="text/x-dc" data-props='{}'>
class Component extends DCLogic {
  componentDidMount() {
    const run = () => { try { const el = document.getElementById('page-top'); let n = el; while (n) { if (n.scrollTop) n.scrollTop = 0; n = n.parentElement; } window.scrollTo(0, 0); if (document.scrollingElement) document.scrollingElement.scrollTop = 0; } catch (e) {} };
    run(); setTimeout(run, 30); setTimeout(run, 250);
  }
  state = { tab: 'vis', a: 0 };
  renderVals() {
    const tab = this.state.tab;
    const T = [{ key: 'vis', label: 'Visuels photoréalistes — Joaillerie' }, { key: 'vibe', label: 'Vibe coding — Routine beauté' }];
    const tabs = T.map((t) => {
      const on = t.key === tab;
      return { ...t, sel: on ? 'true' : 'false', bg: on ? '#EDEBE6' : 'transparent', color: on ? '#0C0C0E' : '#C9C7CF', border: on ? '#EDEBE6' : 'rgba(237,235,230,.18)', pick: () => this.setState({ tab: t.key }) };
    });
    const A = [
      { label: 'Un modèle, trois poses', src: 'assets/images/ia-poses.webp', alt: 'Trois portraits générés par IA du même modèle portant différentes bagues' },
      { label: 'Packshot & portrait', src: 'assets/images/ia-ring.webp', alt: 'Bague en gros plan et portrait noir et blanc générés par IA' }
    ];
    const shots = A.map((s, k) => {
      const on = k === this.state.a;
      return { ...s, pressed: on ? 'true' : 'false', border: on ? '#B3B0FF' : 'rgba(237,235,230,.15)', op: on ? 1 : 0, op2: on ? 1 : 0.65, tf: on ? 'scale(1)' : 'scale(1.03)', pick: () => this.setState({ a: k }) };
    });
    return { tabs, shots };
  }
}
</script>
