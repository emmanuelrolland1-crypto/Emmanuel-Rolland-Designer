<body>
<div id="app"></div>
<noscript><p style="color:#EDEBE6;font-family:sans-serif;padding:40px">Ce site nécessite JavaScript.</p></noscript>
<template id="dc-template">
<div id="page-top" class="stars" style="font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #EDEBE6; background-color: #0C0C0E; min-height: 100%; overflow: hidden">

  <!-- NAV -->
  <header style="position: sticky; top: 0; z-index: 20; background: rgba(12,12,14,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(237,235,230,.07)">
    <nav aria-label="Navigation principale" style="max-width: 1280px; margin: 0 auto; padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
      <a href="#page-top" aria-label="Emmanuel Rolland — haut de page" style="display: flex; align-items: center; gap: 16px; min-height: 44px">
        <img src="assets/images/logo-er.webp" alt="" style="display: block; height: 30px; width: auto">
        <span aria-hidden="true" style="width: 1px; height: 26px; background: rgba(237,235,230,.18)"></span>
        <span style="display: flex; flex-direction: column; gap: 2px; line-height: 1.2">
          <span style="font-weight: 500; font-size: 14px; letter-spacing: -0.01em">Emmanuel Rolland</span>
          <span style="font-size: 12px; color: #A3A1AA">Lead UX Designer — Freelance</span>
        </span>
      </a>
      <div style="display: flex; align-items: center; gap: 28px; flex-wrap: wrap; font-size: 14px">
        <a class="nav-a" href="#projets">Projets</a>
        <a class="nav-a" href="methodologie.html#page-top">Méthodologie</a>
        <a class="nav-a" href="#approche">Approche</a>
        <a class="btn btn-light" href="#contact" style="background: #EDEBE6; color: #0C0C0E; padding: 10px 18px; border-radius: 999px; font-weight: 500">Me contacter</a>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section style="max-width: 1280px; margin: 0 auto; padding: 72px 40px 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <div class="rise" style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
      <img src="assets/images/emmanuel-rolland-avatar.webp" alt="Portrait d’Emmanuel Rolland" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(237,235,230,.18); box-shadow: 0 0 0 4px rgba(179,176,255,.12)">
      <a class="btn btn-ghost" href="#contact" style="display: inline-flex; align-self: center; align-items: center; gap: 10px; padding: 8px 14px; min-height: 44px; border: 1px solid rgba(237,235,230,.14); border-radius: 999px; font-size: 13px; color: #C9C7CF">
        <span class="pulse" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #7BE0A6"></span>
        Disponible pour de nouvelles missions — <span style="color: #EDEBE6; text-decoration: underline; text-underline-offset: 3px">Me contacter</span>
      </a>
      </div>
      <h1 class="rise d1" style="margin: 0; font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; font-size: clamp(52px, 6.6vw, 104px); line-height: 0.98; letter-spacing: -0.02em; text-wrap: balance">Des expériences élégantes, <em style="color: {{accent}}">au service des résultats.</em></h1>
      <p class="rise d2" style="margin: 0; max-width: 600px; font-size: 18px; line-height: 1.6; color: #B5B3BC; font-weight: 300; text-wrap: pretty">Lead Product Designer en UX/UI et stratégie digitale, j’allie design system, innovation IA et performance utilisateur pour générer un impact mesurable sur la conversion et la satisfaction.</p>
      <div class="rise d3" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px">
        <a class="btn btn-light" href="#projets" style="background: #EDEBE6; color: #0C0C0E; padding: 15px 24px; border-radius: 999px; font-weight: 500; font-size: 15px; min-height: 48px; display: inline-flex; align-items: center; gap: 10px">Voir les projets
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
        </a>
        <a class="btn btn-ghost" href="methodologie.html#page-top" style="border: 1px solid rgba(237,235,230,.22); color: #C9C7CF; padding: 15px 24px; border-radius: 999px; font-size: 15px; min-height: 48px; display: inline-flex; align-items: center">Ma méthodologie UX</a>
      </div>
    </div>

    <!-- Hero mockups (interactive) -->
    <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 22px">
      <div class="hero-stage" style="position: relative; width: 100%; max-width: 480px; height: 600px">
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 52%; width: 420px; height: 420px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(179,176,255,.20), rgba(179,176,255,0) 68%)"></div>
        <div class="tilt tilt-back" style="position: absolute; left: 50%; top: 50%; width: 230px; height: 468px; transform: translate(-58%,-46%) rotate(-6deg); filter: drop-shadow(0 30px 50px rgba(0,0,0,.55)); opacity: 0.7">
          <sc-for list="{{back}}" as="s" hint-placeholder-count="5">
            <img class="hero-ph" src="{{s.src}}" alt="{{s.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: {{s.op}}">
          </sc-for>
        </div>
        <div class="tilt tilt-front" style="position: absolute; left: 50%; top: 50%; width: 260px; height: 529px; transform: translate(-22%,-50%) rotate(0deg); filter: drop-shadow(0 40px 60px rgba(0,0,0,.6))">
          <sc-for list="{{front}}" as="s" hint-placeholder-count="5">
            <img class="hero-ph" src="{{s.src}}" alt="{{s.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: {{s.op}}">
          </sc-for>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="font-size: 13px; color: #A3A1AA; min-width: 210px; text-align: right">Galeries Lafayette — {{caption}}</span>
        <div style="display: flex; gap: 6px; align-items: center">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
            <button type="button" onClick="{{d.pick}}" aria-label="{{d.label}}" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 -14px">
              <span style="display: block; width: {{d.w}}; height: 6px; border-radius: 99px; background: {{d.bg}}; transition: all .4s"></span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <!-- CLIENTS -->
  <section aria-label="Références" style="border-top: 1px solid rgba(237,235,230,.07); border-bottom: 1px solid rgba(237,235,230,.07)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 30px 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px 40px; flex-wrap: wrap">
      <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Ils m’ont fait confiance</span>
      <div style="display: flex; gap: 20px 48px; flex-wrap: wrap; align-items: center; font-family: 'Instrument Serif', serif; font-size: 28px; color: #CFCDD4">
        <span>Galeries Lafayette</span>
        <span>TotalEnergies</span>
        <span>ENGIE</span>
        <span>Aroma Zone</span>      </div>
    </div>
  </section>

  <!-- STATS -->
  <section style="max-width: 1280px; margin: 0 auto; padding: 96px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(237,235,230,.14); padding-top: 24px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 88px; line-height: 1">12<span style="color: {{accent}}">+</span></span>
      <span style="font-size: 15px; color: #A3A1AA; line-height: 1.5">Années d’expérience en design produit</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(237,235,230,.14); padding-top: 24px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 88px; line-height: 1">30<span style="color: {{accent}}">+</span></span>
      <span style="font-size: 15px; color: #A3A1AA; line-height: 1.5">Projets livrés dans les secteurs e-commerce, retail &amp; tech</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(237,235,230,.14); padding-top: 24px">
      <span style="font-family: 'Instrument Serif', serif; font-size: 88px; line-height: 1">25<span style="color: {{accent}}">%</span></span>
      <span style="font-size: 15px; color: #A3A1AA; line-height: 1.5">Hausse moyenne de la satisfaction et des taux de conversion</span>
    </div>
  </section>

  <!-- PROJETS -->
  <section id="projets" style="max-width: 1280px; margin: 0 auto; padding: 24px 40px 120px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Projets sélectionnés</span>
        <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(44px, 5vw, 72px); line-height: 1; letter-spacing: -0.015em">Réalisations</h2>
      </div>
      <div role="group" aria-label="Filtrer les projets" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" class="chip" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; font: inherit; font-size: 14px; cursor: pointer">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); gap: 28px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
        <a class="card" href="{{p.href}}" style="display: flex; flex-direction: column; border: 1px solid rgba(237,235,230,.09); border-radius: 22px; background: #111114; overflow: hidden; color: #EDEBE6">
          <div style="position: relative; height: 420px; overflow: hidden; background: {{p.bg}}">
            <sc-if value="{{p.isPhones}}" hint-placeholder-val="{{false}}">
              <div class="vis fan" style="position: absolute; inset: 0">
                <img class="ph p1" src="{{p.ph1}}" alt="" style="position: absolute; left: 50%; top: 50%; width: 170px; transform: translate(-100%,-46%) rotate(-7deg); filter: drop-shadow(0 24px 40px rgba(0,0,0,.5))">
                <img class="ph p3" src="{{p.ph3}}" alt="" style="position: absolute; left: 50%; top: 50%; width: 170px; transform: translate(0%,-46%) rotate(7deg); filter: drop-shadow(0 24px 40px rgba(0,0,0,.5))">
                <img class="ph p2" src="{{p.ph2}}" alt="Écrans de l’application {{p.client}}" style="position: absolute; left: 50%; top: 50%; width: 186px; transform: translate(-50%,-50%); filter: drop-shadow(0 30px 50px rgba(0,0,0,.6))">
              </div>
            </sc-if>
            <sc-if value="{{p.isImage}}" hint-placeholder-val="{{false}}">
              <img class="vis" src="{{p.img}}" alt="{{p.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
            </sc-if>
            <sc-if value="{{p.isPlaceholder}}" hint-placeholder-val="{{false}}">
              <div class="vis" style="position: absolute; inset: 22px; border: 1px dashed rgba(237,235,230,.18); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px">
                <span style="font-family: 'Instrument Serif', serif; font-size: 44px; line-height: 1; color: #D9D7DE">{{p.client}}</span>
                <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Mockups à venir</span>
              </div>
            </sc-if>
          </div>
          <div style="padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
              <span style="font-size: 13px; color: #A3A1AA">{{p.client}}</span>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end">
                <sc-for list="{{p.tags}}" as="t" hint-placeholder-count="2">
                  <span style="font-size: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(237,235,230,.06); color: #C9C7CF">{{t}}</span>
                </sc-for>
              </div>
            </div>
            <h3 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 34px; line-height: 1.08; letter-spacing: -0.01em">{{p.title}}</h3>
            <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #A3A1AA">{{p.desc}}</p>
            <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: {{accent}}; margin-top: 6px">Voir le projet
              <svg class="arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
            </span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <!-- APPROCHE -->
  <section id="approche" style="border-top: 1px solid rgba(237,235,230,.07)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 120px 40px; display: flex; flex-wrap: wrap; gap: 56px">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Approche</span>
        <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(44px, 5vw, 72px); line-height: 1; letter-spacing: -0.015em">Holistique, <em style="color: {{accent}}">par nature.</em></h2>
        <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #A3A1AA; max-width: 420px">Fort de plusieurs années chez Galeries Lafayette, TotalEnergies et ENGIE, j’ai piloté des projets à forte visibilité — refonte d’app mobile, parcours omnicanaux « App &amp; Magasin » — en collaboration étroite avec les équipes produit, tech et marketing.</p>
        <a href="methodologie.html#page-top" style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: {{accent}}; min-height: 44px">Découvrir ma méthodologie UX Research
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
        </a>
      </div>
      <div style="flex: 2 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 20px">
        <div style="border: 1px solid rgba(237,235,230,.09); border-radius: 22px; padding: 32px; background: #111114; display: flex; flex-direction: column; gap: 18px">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#B3B0FF" stroke-width="1.4"><circle cx="18" cy="14" r="6"></circle><path d="M7 31c1.5-6 6-9 11-9s9.5 3 11 9"></path><circle cx="18" cy="18" r="16" stroke-opacity=".35"></circle></svg>
          <h3 style="margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.01em">Centré utilisateur</h3>
          <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #A3A1AA">Une approche centrée sur la compréhension profonde des utilisateurs : tests, interviews et observation terrain. Chaque décision de design s’appuie sur des données qualitatives et quantitatives, pour créer des expériences qui répondent à de vrais besoins — pas à des hypothèses.</p>
        </div>
        <div style="border: 1px solid rgba(237,235,230,.09); border-radius: 22px; padding: 32px; background: #111114; display: flex; flex-direction: column; gap: 18px">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="#B3B0FF" stroke-width="1.4"><path d="M4 28l9-9 6 5 12-14"></path><path d="M24 10h7v7"></path><path d="M4 33h28" stroke-opacity=".35"></path></svg>
          <h3 style="margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.01em">Orienté croissance</h3>
          <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #A3A1AA">Le design comme levier de croissance. Je mesure l’impact de chaque choix sur la conversion, la rétention et la satisfaction, en rapprochant les mondes du design, du business et de la tech. Mon objectif : des expériences qui ont du sens — et du résultat.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- AVIS -->
  <section style="max-width: 1280px; margin: 0 auto; padding: 0 40px 120px; display: flex; flex-direction: column; gap: 40px">
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(36px, 4vw, 56px); line-height: 1.05; letter-spacing: -0.01em">De beaux avis, <em style="color: #A3A1AA">qui font rayonner un sourire.</em></h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 20px">
      <figure class="quote" style="margin: 0; border: 1px solid rgba(237,235,230,.09); border-radius: 22px; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px">
        <blockquote style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1.35; color: #DEDCE2">« Nous avons rencontré en Emmanuel un vrai Product Designer ! Il combine à la fois les volets UX et UI et surtout une très bonne communication et une belle écoute des besoins. Les propositions faites par Emmanuel sont argumentées. »</blockquote>
        <figcaption style="font-size: 14px; color: #8E8C96">— Client Malt</figcaption>
      </figure>
      <figure class="quote" style="margin: 0; border: 1px solid rgba(237,235,230,.09); border-radius: 22px; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px">
        <blockquote style="margin: 0; font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1.35; color: #DEDCE2">« Nous sommes totalement satisfaits du travail livré par Emmanuel. Les livrables sont de grande qualité, conformes à nos attentes et remis dans les temps. Collaboration fluide et professionnelle du début à la fin. »</blockquote>
        <figcaption style="font-size: 14px; color: #8E8C96">— Client freelance</figcaption>
      </figure>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" style="border-top: 1px solid rgba(237,235,230,.07); position: relative">
    <div aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 900px; max-width: 100%; height: 420px; transform: translateX(-50%); background: radial-gradient(ellipse at top, rgba(179,176,255,.14), rgba(179,176,255,0) 70%)"></div>
    <img aria-hidden="true" alt="" src="assets/images/logo-er.webp" style="position: absolute; left: 50%; top: 50%; width: 1100px; max-width: 120%; height: auto; transform: translate(-50%,-50%); opacity: 0.035; pointer-events: none">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 140px 40px 120px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px">
      <span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8E8C96">Contact</span>
      <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: clamp(56px, 8vw, 128px); line-height: 0.95; letter-spacing: -0.02em">Un projet en tête ?</h2>
      <p style="margin: 0; max-width: 520px; font-size: 17px; line-height: 1.6; color: #A3A1AA">Refonte, design system, app mobile ou recherche utilisateur : parlons de vos enjeux.</p>
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap">
      <a class="btn btn-light" href="mailto:emmanuel.rolland1@gmail.com?subject=Demande%20de%20mission%20freelance%20%E2%80%94%20UX%20%2F%20Product%20Design&amp;body=Bonjour%20Emmanuel%2C%0A%0AJe%20vous%20contacte%20au%20sujet%20d%E2%80%99un%20projet%20%3A%0A%0A-%20Contexte%20%3A%20%0A-%20Besoin%20%3A%20%0A-%20D%C3%A9lais%20%3A%20%0A%0AMerci%20!" target="_blank" rel="noopener" aria-label="Envoyer un email à emmanuel.rolland1@gmail.com" style="background: #EDEBE6; color: #0C0C0E; padding: 18px 30px; border-radius: 999px; font-weight: 500; font-size: 16px; min-height: 52px; display: inline-flex; align-items: center; gap: 10px">emmanuel.rolland1@gmail.com
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12L12 4M5 4h7v7"></path></svg>
      </a>
